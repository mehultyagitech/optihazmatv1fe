<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Heavier drawing of the mark so it holds up at 16-32px; follows the
       browser's light/dark theme. -->
  <style>
    .hull { stroke: #0D47A1; }
    .point { fill: #F57C00; stroke: #F57C00; }
    @media (prefers-color-scheme: dark) {
      .hull { stroke: #E3F2FD; }
      .point { fill: #FFA726; stroke: #FFA726; }
    }
  </style>
